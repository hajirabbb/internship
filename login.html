<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="icon" type="image/png" href="assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/images/favicon/site.webmanifest" />

  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <main>
        <div class="main">

            
            <div class="login-image">
                <img src="assets/images/building.jpeg" class="building" alt="GhIPSS building" />
                <div class="brand">
                    <img src="assets/images/logo1.png" alt="GhIPSS Logo" class="logo" />
                    <span>GHIPSS</span>
                </div>
            </div>

           
            <div class="content">
                <button type="button" class="signup-btn">Sign up</button>

                <h3>Welcome Back to GHIPSS Dashboard</h3>
                <p>Sign in to continue</p>

                <form method="post">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">

                    <button type="submit" class="signin-btn">Sign in</button>

                    <div class="others">
                        <label class="remember">
                            <input type="checkbox" name="remember"> Remember me
                        </label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <div class="login-options">
                        <p class="divider">Login using</p>

                        <div class="social-login">
                            <button type="button" class="social-btn">
                                <img src="assets/images/icons8-google-48.png" alt="google icon" width="18" height="18" >
                                Continue with Google
                            </button>

                            <button type="button" class="social-btn">
                               <img src="assets/images/icons8-facebook-48.png" alt="facebook icon" width="18" height="18">
                                Continue with Facebook
                            </button>
                        </div>

                        <p class="foot ">Don't have an account yet? <a href="#">Register</a></p>
                    </div>
                </form>
            </div>

        </div>
    </main>
</body>
</html>
