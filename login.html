<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="icon" type="image/png" href="assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/images/favicon/site.webmanifest" />

  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <main>
        <div class="main">

            
            <div class="login-image">
                <img src="assets/images/building.png" class="building" alt="GhIPSS building" />
                <div class="brand">
                    <img src="assets/images/logo1.png" alt="GhIPSS Logo" class="logo" />
                    <span>GHIPSS</span>
                </div>
            </div>

           
            <div class="content">
                <button type="button" class="signup-btn">Sign up</button>

                <h3>Welcome Back to GHIPSS Dashboard</h3>
                <p class="sign">Sign in to continue</p>

                <form method="post">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="password">Password</label>
                     <div class="password-wrapper">                       
  <input type="password" id="password" name="password"  required/>
  <button type="button" id="togglePassword" aria-label="Show password">
    <!-- Eye (shown when password is hidden) -->
    <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
   
    <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
      <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
  </button>
</div>
                    <button type="submit" class="signin-btn">Sign in</button>

                    <div class="others">
                        <label class="remember">
                            <input type="checkbox" name="remember"> Remember me
                        </label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <div class="login-options">
                        <p class="divider">Login using</p>

                        <div class="social-login">
                            <button type="button" class="social-btn">
                                <img src="assets/images/icons8-google-48.png" alt="google icon" width="18" height="18" >
                                Continue with Google
                            </button>

                            <button type="button" class="social-btn">
                               <img src="assets/images/icons8-facebook-48.png" alt="facebook icon" width="18" height="18">
                                Continue with Facebook
                            </button>
                        </div>

                        <p class="foot ">Don't have an account yet? <a href="#">Register</a></p>
                       
                    </div>
                </form>
            </div>

        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
