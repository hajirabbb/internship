<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/images/favicon/favicon-96x96.png" sizes="96x96" />
   <link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg" />
   <link rel="shortcut icon" href="assets/images/favicon/favicon.ico" />
   <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png" />
   <link rel="manifest" href="assets/images/favicon/site.webmanifest" />
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Dashboard</title>
</head>
<body>
    <div class="main">
    <nav>
    <img class="logo"  src="assets/images/logo1.png" alt="Ghipss logo" >
    <a href="#dashboard">Dashboard<span class="material-symbols-outlined">
        dashboard</span></a>
        <a href="#search">Search <span class="material-symbols-outlined">
            search</span>
        </a>
        <a href="#profile">Profile<span class="material-symbols-outlined">
        person</span></a>
 </nav>
       
   
 
 <main>
 <div class="heading">
    <h1 id="dashboard">Dashboard</h1>
 </div>
 
  <section>

    
 <div class="table-card">
  <div class="table-toolbar">
    <div class="table-count">
      <span class="count-number">6</span>
      <span class="count-label">total interns</span>
    </div>

    <div class="toolbar-actions">
        <div class="search-box">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
  </svg>
  <input type="search" id="table-search" placeholder="Search interns...">
</div>
      <button class="btn btn--ghost">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5h18M6 12h12M10 19h4"/>
        </svg>
        Filters
      </button>
      <button class="btn btn--primary">+ Add Intern</button>
    </div>
  </div>
     <p id="status"></p>
     <div class="table-wrap">
    <table class="custom-table">
        <thead>
            <tr >
            <th><input type="checkbox" class="row-check"></th>
              <th>Name <span class="sort">⇅</span></th>
               <th>Email <span class="sort">⇅</span></th>
                 <th>Phone Number <span class="sort">⇅</span></th>
            </tr>
        </thead>
       <tbody id="usersBody"></tbody>
    </table>
    </div>


 </div>
 </section>
 </main>
 </div>
 </div>
 <footer>
    <img class="logo"  src="assets/images/logo1.png" alt="Ghipss logo">
    <p>&copy; 2026 Ghana Interbank Payment  and Settlement Systems</p>
 </footer>
    
  <script src="js/table.js
  "></script>  
</body>
</html>
